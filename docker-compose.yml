version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - VECTOR_STORE=faiss
      - OCR_ENGINE=pytesseract
      - LOG_LEVEL=INFO
      - USE_RERANKER=false
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
      - model-cache:/app/models/cache
    env_file:
      - .env.example

volumes:
  model-cache:
