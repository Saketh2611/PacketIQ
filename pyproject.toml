[project]
name = "document-intelligence"
version = "0.1.0"
description = "Document Packet Intelligence & Evidence Retrieval System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.23.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.3.0",
    "torch>=2.1.0",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "datasets>=2.16.0",
    "huggingface-hub>=0.20.0",
    "pytesseract>=0.3.10",
    "psutil>=5.9.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "httpx>=0.26.0"]
xgboost = ["xgboost>=2.0.0"]
lightgbm = ["lightgbm>=4.0.0"]

[project.scripts]
doc-intel = "document_intelligence.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
